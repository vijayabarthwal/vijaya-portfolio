<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>You Are Never Ready — And That's Okay | Vijaya Barthwal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1efe9;
            color: #374151;
            line-height: 1.8;
        }

        .page {
            max-width: 1000px;
            margin: auto;
            padding: 35px 24px 60px;
        }

        /* Back Link */

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            color: #2563eb;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
        }

        .back-link:hover {
            color: #1d4ed8;
        }

        /* Hero */

        .hero {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #172033, #263b5a);
            color: #ffffff;
            padding: 65px 55px;
            border-radius: 24px;
            margin-bottom: 28px;
            box-shadow: 0 18px 45px rgba(30, 58, 95, 0.18);
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            right: -70px;
            top: -70px;
        }

        .eyebrow {
            position: relative;
            z-index: 1;
            display: inline-block;
            color: #bfdbfe;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .hero h1 {
            position: relative;
            z-index: 1;
            max-width: 760px;
            font-size: clamp(40px, 7vw, 68px);
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 22px;
        }

        .hero-description {
            position: relative;
            z-index: 1;
            max-width: 700px;
            color: #dbeafe;
            font-size: 19px;
            line-height: 1.7;
        }

        /* Main Content */

        .article {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 55px;
            box-shadow: 0 12px 35px rgba(30, 58, 95, 0.08);
        }

        .section-label {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            margin-bottom: 12px;
        }

        .article h2 {
            color: #111827;
            font-size: 30px;
            line-height: 1.3;
            margin-bottom: 25px;
        }

        .intro {
            font-size: 19px;
            color: #526173;
            line-height: 1.8;
            padding-bottom: 35px;
            margin-bottom: 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .essay p {
            color: #374151;
            font-size: 17px;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        /* Pull Quotes */

        .pull-quote {
            margin: 40px 0;
            padding: 28px 30px;
            background: #f8fafc;
            border-left: 5px solid #2563eb;
            border-radius: 0 14px 14px 0;
            color: #172033;
            font-size: 21px;
            line-height: 1.6;
            font-weight: 700;
        }

        .pull-quote span {
            display: block;
            margin-top: 10px;
            color: #718096;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Final Highlight */

        .final-thought {
            margin-top: 45px;
            padding: 40px;
            border-radius: 18px;
            background: #f1efe9;
            text-align: center;
        }

        .final-thought p {
            color: #172033;
            font-size: 25px;
            line-height: 1.6;
            font-weight: 700;
            margin: 0;
        }

        /* Skills */

        .skills {
            margin-top: 50px;
            padding-top: 35px;
            border-top: 1px solid #e5e7eb;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }
